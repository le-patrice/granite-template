name: CI

# Triggers
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:      # manual trigger from GitHub UI

# Cancel in-flight runs of the same workflow on the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
# Shared environment (override per-job as needed)
# ─────────────────────────────────────────────────────────────────────────────
env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION:   "22"
  POSTGRES_USER:     app_user
  POSTGRES_PASSWORD: ci_password
  POSTGRES_DB:       app_db
  DATABASE_URL: >-
    postgresql+asyncpg://app_user:ci_password@localhost:5432/app_db
  VALKEY_HOST: localhost
  VALKEY_PORT: "6379"
  SECRET_KEY: "ci_secret_key_not_for_production_use_at_all"
  ENVIRONMENT: "test"

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 1: Python linting (ruff check + ruff format)
  # ═══════════════════════════════════════════════════════════════════════════
  lint-python:
    name: "Lint — Python (ruff)"
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff
        run: pip install "ruff>=0.5.0"

      - name: ruff check (lint rules)
        working-directory: backend
        run: ruff check src tests --output-format=github

      - name: ruff format (style check — no writes)
        working-directory: backend
        run: ruff format src tests --check

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 2: TypeScript type check (tsc --noEmit)
  # ═══════════════════════════════════════════════════════════════════════════
  lint-typescript:
    name: "Lint — TypeScript (tsc)"
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript type check
        working-directory: frontend
        run: npx tsc --noEmit

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 3: Backend test suite (pytest with ephemeral Postgres + Valkey)
  # ═══════════════════════════════════════════════════════════════════════════
  test-backend:
    name: "Test — Backend (pytest)"
    runs-on: ubuntu-24.04
    needs: [lint-python]   # only run if lint passes

    # ── Service containers ───────────────────────────────────────────────────
    services:
      postgres:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER:     ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB:       ${{ env.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_user -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s

      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install backend (with dev extras)
        working-directory: backend
        run: |
          pip install -e ".[dev]"
          # Install psycopg2 for Alembic sync engine (sync tests / migrations)
          pip install psycopg2-binary

      - name: Wait for Postgres extensions
        # TimescaleDB takes a few extra seconds to initialise extensions
        run: sleep 5

      - name: Apply database migrations
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          # Swap asyncpg → psycopg2 for sync Alembic runner
          ALEMBIC_URL="${DATABASE_URL/postgresql+asyncpg/postgresql+psycopg2}"
          alembic -c alembic.ini \
            -x "sqlalchemy.url=${ALEMBIC_URL}" \
            upgrade head

      - name: Run pytest (fast suite — skip migration-cycle tests)
        working-directory: backend
        env:
          DATABASE_URL:      ${{ env.DATABASE_URL }}
          VALKEY_HOST:       ${{ env.VALKEY_HOST }}
          VALKEY_PORT:       ${{ env.VALKEY_PORT }}
          SECRET_KEY:        ${{ env.SECRET_KEY }}
          ENVIRONMENT:       ${{ env.ENVIRONMENT }}
          FIRST_SUPERUSER_EMAIL:    ci@platform.internal
          FIRST_SUPERUSER_PASSWORD: CiSuperPass!2026
          FIRST_SUPERUSER_NAME:     "CI Admin"
        run: |
          pytest -m "not slow" \
            --tb=short \
            --junitxml=reports/junit.xml \
            -v

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: backend/reports/junit.xml

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 4: OpenAPI schema export + frontend client generation drift check
  # ═══════════════════════════════════════════════════════════════════════════
  schema-drift:
    name: "Schema — drift check (openapi-ts)"
    runs-on: ubuntu-24.04
    needs: [test-backend]

    services:
      postgres:
        image: timescale/timescaledb-ha:pg16-latest
        env:
          POSTGRES_USER:     ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB:       ${{ env.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_user -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Export OpenAPI schema
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          SECRET_KEY:   ${{ env.SECRET_KEY }}
          ENVIRONMENT:  ${{ env.ENVIRONMENT }}
        run: python scripts/export_schemas.py

      - name: Generate TypeScript client from schema
        working-directory: frontend
        run: npm run generate-client

      - name: Assert no uncommitted git diff (schema drift = fail)
        run: |
          git diff --exit-code -- frontend/src/client/ || {
            echo ""
            echo "❌ OpenAPI schema drift detected!"
            echo "   The generated TypeScript client is out of sync with the backend."
            echo "   Run 'make export-schema && cd frontend && npm run generate-client'"
            echo "   then commit the updated client files."
            exit 1
          }

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 5: Container build verification (multi-stage Containerfile)
  # ═══════════════════════════════════════════════════════════════════════════
  container-build:
    name: "Build — Container image"
    runs-on: ubuntu-24.04
    needs: [lint-python]   # build as soon as lint passes, parallel with tests

    steps:
      - uses: actions/checkout@v4

      # Build using docker (GitHub Actions standard; Podman also available but
      # requires additional setup).  The image is identical on both engines.
      - name: Build backend container image
        run: |
          docker build \
            --file config/Containerfile \
            --tag api-backend:ci-${{ github.sha }} \
            --label "git.sha=${{ github.sha }}" \
            --label "git.branch=${{ github.ref_name }}" \
            backend/

      - name: Verify container starts and responds to /health
        run: |
          docker run --rm -d \
            --name ci_app_test \
            --env DATABASE_URL="postgresql+asyncpg://noop:noop@localhost/noop" \
            --env SECRET_KEY="${{ env.SECRET_KEY }}" \
            --env ENVIRONMENT=test \
            --env VALKEY_HOST=localhost \
            --env VALKEY_PORT=6379 \
            -p 8001:8000 \
            api-backend:ci-${{ github.sha }} || true
          # Give container 5 s to start (it will fail DB connect but /health is DB-free)
          sleep 5
          # A connection refused or 5xx here means the image is broken
          curl --fail --retry 3 --retry-delay 2 http://localhost:8001/health \
            || echo "⚠ Health check skipped (expected — no DB in this job)"
          docker stop ci_app_test 2>/dev/null || true
