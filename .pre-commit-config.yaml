# ==============================================================================
# LiteForge / Enterprise Platform — Pre-Commit Hook Configuration
# ==============================================================================
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: "^(copier\\.ya?ml|.*\\.jinja)$"
      - id: check-added-large-files
        args: ["--maxkb=2000"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      # Run the linter
      - id: ruff
        args: [--fix]
        files: ^backend/(src|tests)/
      # Run the formatter
      - id: ruff-format
        files: ^backend/(src|tests)/
