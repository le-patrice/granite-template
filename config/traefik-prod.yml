# ===========================================================================
# Traefik v3 — Production Static Configuration with Cloudflare Zero Trust Ingress
# ===========================================================================

# ── Global Daemon Settings ──────────────────────────────────────────────────
global:
  checkNewVersion: false
  sendAnonymousUsage: false

# ── Structured Logging ──────────────────────────────────────────────────────
log:
  level: INFO
  format: json

accessLog:
  format: common
  bufferingSize: 0 # Flushes log lines immediately without buffer delay
  fields:
    defaultMode: keep
    headers:
      defaultMode: drop
      names:
        X-Request-Id: keep
        X-Forwarded-For: keep
        CF-Connecting-IP: keep
        CF-Ray: keep
        X-Forwarded-Proto: keep

# ── Entry Points ─────────────────────────────────────────────────────────────
entryPoints:
  web:
    address: ":80"
    forwardedHeaders:
      trustedIPs:
        - "173.245.48.0/20"
        - "103.21.244.0/22"
        - "103.22.200.0/22"
        - "103.31.4.0/22"
        - "141.101.64.0/18"
        - "108.162.192.0/18"
        - "190.93.240.0/20"
        - "188.114.96.0/20"
        - "197.234.240.0/22"
        - "198.41.128.0/17"
        - "162.158.0.0/15"
        - "104.16.0.0/13"
        - "104.24.0.0/14"
        - "172.64.0.0/13"
        - "131.0.72.0/22"
        - "10.89.0.0/16"
        - "127.0.0.1/32"
    http2:
      maxConcurrentStreams: 500

# ── Providers ───────────────────────────────────────────────────────────────
providers:
  file:
    filename: /etc/traefik/traefik-prod.yml
    watch: false

# ── Middlewares & Routing ───────────────────────────────────────────────────
http:
  middlewares:
    cors-headers:
      headers:
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        accessControlAllowHeaders:
          - "*"
        accessControlMaxAge: 86400
        addVaryHeader: true

    secure-headers:
      headers:
        frameDeny: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"
        customResponseHeaders:
          X-Powered-By: ""

    # ── Rate Limiting (Global Edge Throttling) ──────────────────────────────
    global-ratelimit:
      rateLimit:
        average: 150
        burst: 50
        period: 1m
        sourceCriterion:
          ipStrategy:
            depth: 1

  routers:
    # API Router
    api-router:
      entryPoints:
        - web
      rule: "HostRegexp(`^{subdomain:(api|api-prod)\\..*}`) || PathPrefix(`/api`)"
      service: app-service
      middlewares:
        - cors-headers
        - secure-headers
        - global-ratelimit

    # Docs Router
    docs-router:
      entryPoints:
        - web
      rule: "HostRegexp(`^{subdomain:(docs|docs-prod)\\..*}`) || PathPrefix(`/docs`) || PathPrefix(`/scalar`) || PathPrefix(`/swagger`)"
      service: app-service
      middlewares:
        - cors-headers
        - secure-headers

    # Health & Metrics Router
    health-metrics-router:
      entryPoints:
        - web
      rule: "PathPrefix(`/health`) || PathPrefix(`/metrics`)"
      service: app-service
      middlewares:
        - secure-headers

    # Frontend SPA Router
    frontend-router:
      entryPoints:
        - web
      rule: "PathPrefix(`/`)"
      service: frontend-service
      middlewares:
        - secure-headers

  services:
    app-service:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://app:8000"

    frontend-service:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://frontend:80"
