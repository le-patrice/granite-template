# ===========================================================================
# Development mesh  –  rootless Podman
#
# Services
# --------
#   traefik        port 80  — reverse proxy (API, docs, frontend)
#                  port 8080 — Traefik dashboard (dev only)
#   app            internal — Litestar / Granian backend (no direct host port)
#   frontend       internal — Vite HMR dev-server (no direct host port)
#   postgres-db    5432     — TimescaleDB + pgvector
#   valkey-cache   6379     — Valkey key-value store
#
# Traffic flow
# ------------
#   browser → :80 (Traefik) ─┬─ /api/* /docs* /scalar* → app:8000
#                             └─ /*                      → frontend:5173
# ===========================================================================

name: ${COMPOSE_PROJECT_NAME:-enterprise}

networks:
  platform_net:
    name: ${COMPOSE_PROJECT_NAME:-enterprise}_net
    driver: bridge

services:

  # ── PgBouncer Connection Pooler (Transaction Pooling Gateway) ──────────────
  pgbouncer:
    image: docker.io/edoburu/pgbouncer:latest
    container_name: ${COMPOSE_PROJECT_NAME:-enterprise}_pgbouncer
    restart: unless-stopped
    expose:
      - "6432"
    environment:
      - DB_USER=app_user
      - DB_PASSWORD=secure_dev_password
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - DB_NAME=app_db
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=1000
      - DEFAULT_POOL_SIZE=25
      - AUTH_TYPE=scram-sha-256
      - LISTEN_PORT=6432
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - platform_net

  # ── Traefik reverse proxy ──────────────────────────────────────────────────
  traefik:
    image: docker.io/traefik:v3.3
    container_name: ${COMPOSE_PROJECT_NAME:-enterprise}_traefik
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:80"      # public HTTP / h2c entrypoint
      - "${DASHBOARD_PORT:-8080}:8080"  # Traefik dashboard (dev only)
    volumes:
      # Podman rootless socket — expose it read-only for label discovery
      - /run/user/${UID:-1000}/podman/podman.sock:/run/podman/podman.sock:ro
      # Static configuration file
      - ./traefik-dev.yml:/etc/traefik/traefik-dev.yml:ro
    command:
      - "--providers.file.filename=/etc/traefik/traefik-dev.yml"
      - "--providers.docker.endpoint=unix:///run/podman/podman.sock"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=${COMPOSE_PROJECT_NAME:-enterprise}_net"
      - "--entrypoints.web.address=:80"
      - "--log.level=INFO"
      - "--log.format=json"
      - "--accesslog=true"
      - "--accesslog.format=json"
      - "--api.dashboard=true"
      - "--api.insecure=true"
    networks:
      - platform_net
    depends_on:
      - app

  # ── Cloudflare Zero Trust Tunnel ───────────────────────────────────────────
  cloudflared:
    image: docker.io/cloudflare/cloudflared:latest
    container_name: ${COMPOSE_PROJECT_NAME:-enterprise}_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARED_TUNNEL_TOKEN:-}
    networks:
      - platform_net
    profiles:
      - production
      - edge
    depends_on:
      - traefik

  # ── Mailpit Mock SMTP Server (Development Email Inspection) ────────────────
  mailpit:
    image: docker.io/axllent/mailpit:latest
    container_name: ${COMPOSE_PROJECT_NAME:-enterprise}_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"      # SMTP ingress
      - "8025:8025"      # Web UI (http://localhost:8025)
    networks:
      - platform_net

  # ── Litestar backend ───────────────────────────────────────────────────────
  app:
    build:
      context: ../backend
      dockerfile: ../config/Containerfile
    container_name: ${COMPOSE_PROJECT_NAME:-enterprise}_backend
    restart: unless-stopped
    # No host-port binding — all traffic comes through Traefik
    expose:
      - "8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONIOENCODING=utf-8
      - DATABASE_URL=postgresql+asyncpg://app_user:secure_dev_password@pgbouncer:6432/app_db
      - DIRECT_DATABASE_URL=postgresql+asyncpg://app_user:secure_dev_password@postgres-db:5432/app_db
      - VALKEY_HOST=valkey-cache
      - VALKEY_PORT=6379
      - ENVIRONMENT=development
      - APP_BASE_URL=http://localhost
      - SECRET_KEY=${SECRET_KEY:-e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855}
      - FIRST_SUPERUSER_EMAIL=${FIRST_SUPERUSER_EMAIL:-admin@platform.internal}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD:-AdminSecurePassword2026!}
      # SMTP: leave blank for structlog mock mode
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
    volumes:
      - ../backend/src:/app/src:z        # live-reload via Granian --reload
      - ../backend/tests:/app/tests:z
      - ../backend/scripts:/app/scripts:z
      - ../backend/alembic:/app/alembic:z
      - ../backend/alembic.ini:/app/alembic.ini:z
      - ../backend/pyproject.toml:/app/pyproject.toml:z
      - ../logs:/app/logs:z
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      pgbouncer:
        condition: service_started
      valkey-cache:
        condition: service_started
    networks:
      - platform_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.app.loadbalancer.server.port=8000"

  # ── SAQ Background Worker ──────────────────────────────────────────────────
  worker:
    build:
      context: ../backend
      dockerfile: ../config/Containerfile
    container_name: ${COMPOSE_PROJECT_NAME:-enterprise}_worker
    restart: unless-stopped
    command: ["python", "-m", "saq", "app.core.worker.settings", "--workers", "4"]
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONIOENCODING=utf-8
      - DATABASE_URL=postgresql+asyncpg://app_user:secure_dev_password@pgbouncer:6432/app_db
      - DIRECT_DATABASE_URL=postgresql+asyncpg://app_user:secure_dev_password@postgres-db:5432/app_db
      - VALKEY_HOST=valkey-cache
      - VALKEY_PORT=6379
      - ENVIRONMENT=development
      - APP_BASE_URL=http://localhost
      - SECRET_KEY=${SECRET_KEY:-e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
    volumes:
      - ../backend/src:/app/src:z
      - ../backend/pyproject.toml:/app/pyproject.toml:z
      - ../logs:/app/logs:z
    depends_on:
      pgbouncer:
        condition: service_started
      valkey-cache:
        condition: service_started
    networks:
      - platform_net

  # ── Vite frontend dev-server ───────────────────────────────────────────────
  frontend:
    image: docker.io/library/node:22-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-enterprise}_frontend
    working_dir: /app
    volumes:
      - ../frontend:/app:z
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=
      - VITE_INITIAL_ADMIN_EMAIL=${FIRST_SUPERUSER_EMAIL:-admin@platform.internal}
      - VITE_INITIAL_ADMIN_PASSWORD=${FIRST_SUPERUSER_PASSWORD:-AdminSecurePassword2026!}
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    networks:
      - platform_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.frontend.loadbalancer.server.port=5173"

  # ── TimescaleDB + pgvector ─────────────────────────────────────────────────
  postgres-db:
    image: docker.io/timescale/timescaledb-ha:pg16
    container_name: ${COMPOSE_PROJECT_NAME:-enterprise}_postgres
    restart: unless-stopped
    environment:
      - PGDATA=/var/lib/postgresql/data
      - POSTGRES_USER=app_user
      - POSTGRES_PASSWORD=secure_dev_password
      - POSTGRES_DB=app_db
    volumes:
      - postgres_data:/var/lib/postgresql/data:Z
    ports:
      - "${POSTGRES_PORT:-5432}:5432"    # direct access for migrations & psql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U app_user -d app_db || exit 0"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - platform_net

  # ── Valkey ────────────────────────────────────────────────────────────────
  valkey-cache:
    image: docker.io/valkey/valkey:8-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-enterprise}_valkey
    restart: unless-stopped
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey_data:/data:Z
    networks:
      - platform_net

volumes:
  postgres_data:
    name: ${COMPOSE_PROJECT_NAME:-enterprise}_postgres_data
  valkey_data:
    name: ${COMPOSE_PROJECT_NAME:-enterprise}_valkey_data
  frontend_node_modules:
    name: ${COMPOSE_PROJECT_NAME:-enterprise}_frontend_node_modules

