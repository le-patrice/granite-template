# ===========================================================================
# Traefik v3 — Development Static Configuration with Cloudflare Ingress
#
# Loaded via --providers.file.filename=/etc/traefik/traefik-dev.yml inside
# the Traefik container (see platform-pod.yaml).
#
# Routing Summary
# ---------------
#  api.<domain> or /api/*                  → app:8000   (Litestar JSON API)
#  docs.<domain> or /docs, /scalar, /swagger → app:8000 (OpenAPI Interactive Docs)
#  /health/*, /metrics                     → app:8000   (Health & Metrics)
#  <domain> or /*                          → frontend:5173 (Vite HMR dev-server)
# ===========================================================================

# ── Global Daemon Settings ──────────────────────────────────────────────────
global:
  checkNewVersion: false
  sendAnonymousUsage: false

# ── Structured Logging ──────────────────────────────────────────────────────
log:
  level: INFO            # DEBUG | INFO | WARN | ERROR
  format: json           # json | common

accessLog:
  format: common
  bufferingSize: 0 # Flushes log lines immediately without buffer delay
  fields:
    defaultMode: keep
    headers:
      defaultMode: drop
      names:
        X-Request-Id: keep
        X-Forwarded-For: keep
        CF-Connecting-IP: keep
        CF-Ray: keep
        X-Forwarded-Proto: keep

# ── API / Dashboard (dev only — never expose in production) ─────────────────
api:
  dashboard: true
  insecure: true         # reachable at http://localhost:8080/dashboard/

# ── Entry Points ─────────────────────────────────────────────────────────────
entryPoints:
  web:
    address: ":80"
    forwardedHeaders:
      insecure: true     # Trust Cloudflare Zero Trust tunnel & proxy headers
    http2:
      maxConcurrentStreams: 250

# ── Providers: file (this file) ─────────────────────────────────────────────
providers:
  file:
    filename: /etc/traefik/traefik-dev.yml
    watch: true


# ── Middlewares & Routing ───────────────────────────────────────────────────
http:
  middlewares:

    # ── CORS — applied to API routes ────────────────────────────────────────
    cors-headers:
      headers:
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        accessControlAllowHeaders:
          - "*"
        accessControlAllowOriginList:
          - "http://localhost"
          - "http://localhost:5173"
          - "http://localhost:3000"
          - "http://localhost:8000"
          - "https://*.pages.dev"
        accessControlMaxAge: 86400
        addVaryHeader: true

    # ── Security Headers ────────────────────────────────────────────────────
    secure-headers:
      headers:
        frameDeny: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "same-origin"
        customResponseHeaders:
          X-Powered-By: ""

    # ── Rate Limiting (Global Edge Throttling) ──────────────────────────────
    global-ratelimit:
      rateLimit:
        average: 150
        burst: 50
        period: 1m
        sourceCriterion:
          ipStrategy:
            depth: 1

  # ── Routers ────────────────────────────────────────────────────────────────
  routers:

    # 0. Go Telemetry Ingest Bypass Router (High-throughput zero-copy ingestion)
    telemetry-ingest-router:
      entryPoints:
        - web
      rule: "PathPrefix(`/api/v1/telemetry/ingest`)"
      priority: 100
      service: telemetry-ingest-service
      middlewares:
        - cors-headers
        - secure-headers

    # 1. API Router (Host api.* or Path /api/*)
    api-router:
      entryPoints:
        - web
      rule: "HostRegexp(`^{subdomain:(api|api-dev)\\..*}`) || PathPrefix(`/api`)"
      priority: 66
      service: app-service
      middlewares:
        - cors-headers
        - secure-headers
        - global-ratelimit

    # 2. Docs Router (Host docs.* or Path /docs, /scalar, /swagger)
    docs-router:
      entryPoints:
        - web
      rule: "HostRegexp(`^{subdomain:(docs|docs-dev)\\..*}`) || PathPrefix(`/docs`) || PathPrefix(`/scalar`) || PathPrefix(`/swagger`)"
      priority: 120
      service: app-service
      middlewares:
        - cors-headers
        - secure-headers

    # 3. Health Probes & Metrics Router
    health-metrics-router:
      entryPoints:
        - web
      rule: "PathPrefix(`/health`) || PathPrefix(`/metrics`)"
      priority: 47
      service: app-service
      middlewares:
        - secure-headers

    # 4. Frontend Router (Catch-all for SPA UI)
    frontend-router:
      entryPoints:
        - web
      rule: "PathPrefix(`/`)"
      priority: 15
      service: frontend-service
      middlewares:
        - secure-headers

  # ── Backend Services ───────────────────────────────────────────────────────
  services:

    # Litestar / Granian backend service (in-pod loopback)
    app-service:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://127.0.0.1:8000"

    # Go High-Throughput Telemetry Ingest Microservice (in-pod loopback)
    telemetry-ingest-service:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://127.0.0.1:8001"

    # Vite dev-server frontend service (in-pod loopback or host)
    frontend-service:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://127.0.0.1:5173"
