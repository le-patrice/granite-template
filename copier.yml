# ==============================================================================
# LiteForge Boilerplate — Copier Scaffolding Definition
# ==============================================================================
_min_copier_version: "9.0.0"
_subdirectory: ""
_exclude:
  - "copier.yaml"
  - "copier.yml"
  - "~*"
  - "*.py[co]"
  - "__pycache__"
  - "**/__pycache__"
  - ".git"
  - ".DS_Store"
  - ".ruff_cache"
  - "**/.ruff_cache"
  - ".pytest_cache"
  - "**/.pytest_cache"
  - ".venv"
  - "**/.venv"
  - "node_modules"
  - "**/node_modules"
  - "**/dist"
  - "references"
  - "references/**"
  - "{% if not enable_quadlets %}deployments/prod/quadlets/**{% endif %}"
  - "{% if not include_frontend %}frontend/**{% endif %}"
  - "{% if not include_frontend %}deployments/prod/quadlets/frontend.container*{% endif %}"
  - "{% if not include_go_telemetry %}services/telemetry-ingest{% endif %}"
  - "{% if not include_go_telemetry %}services/telemetry-ingest/**{% endif %}"
  - "{% if not include_go_telemetry %}deployments/prod/quadlets/telemetry-ingest.container*{% endif %}"

# ------------------------------------------------------------------------------
# Project Identity & Metadata
# ------------------------------------------------------------------------------
project_name:
  type: str
  help: "Human-readable project name"
  default: "Enterprise Platform"

project_slug:
  type: str
  help: "Slugified project identifier (used for container naming prefix, images, networks, and volumes)"
  default: "{{ project_name|lower|replace(' ', '-')|replace('_', '-') }}"

project_package:
  type: str
  help: "Python package root module name"
  default: "{{ project_slug|lower|replace('-', '_') }}"

project_description:
  type: str
  help: "One-line description shown in pyproject.toml and README"
  default: "Enterprise Litestar ASGI platform with clean architecture, TimescaleDB, Valkey, and SAQ background workers"

author_name:
  type: str
  help: "Author / Organization Name"
  default: "Core Engineering Team"

author_email:
  type: str
  help: "Maintainer contact email"
  default: "admin@platform.internal"

# ------------------------------------------------------------------------------
# Runtimes & Infrastructure Engines
# ------------------------------------------------------------------------------
container_engine:
  type: str
  help: "Default container runtime engine"
  choices:
    - "podman"
    - "docker"
  default: "podman"

python_version:
  type: str
  help: "Target Python runtime"
  choices:
    - "3.11"
    - "3.12"
    - "3.13"
  default: "3.11"

app_port:
  type: int
  help: "Public API port (host bound)"
  default: 8000

enable_quadlets:
  type: bool
  help: "Generate rootless systemd Quadlet declarative units (platform.pod, *.container, *.volume) for native production orchestration"
  default: true

# ------------------------------------------------------------------------------
# API Documentation & Interactive UI Selection
# ------------------------------------------------------------------------------
docs_ui:
  type: str
  help: "Default OpenAPI interactive documentation renderer (renders on /docs)"
  choices:
    - "swagger"
    - "scalar"
    - "redoc"
    - "elements"
    - "rapidoc"
  default: "swagger"

# ------------------------------------------------------------------------------
# Data Persistence, Search & Pooling
# ------------------------------------------------------------------------------
postgres_user:
  type: str
  help: "PostgreSQL root superuser username"
  default: "app_user"

postgres_db:
  type: str
  help: "Primary PostgreSQL database name"
  default: "app_db"

postgres_port:
  type: int
  help: "PostgreSQL port (host bound)"
  default: 5432

include_timescaledb:
  type: bool
  help: "Enable TimescaleDB engine for time-series telemetry hypertables & automated compression"
  default: true

include_pgvector:
  type: bool
  help: "Enable pgvector extension & HNSW indexing for AI semantic embeddings"
  default: true

include_pgbouncer:
  type: bool
  help: "Include PgBouncer connection pooler gateway container for high-concurrency scaling"
  default: true

include_go_telemetry:
  type: bool
  help: "Include compiled Go high-throughput telemetry ingestion bypass microservice (POST /api/v1/telemetry/ingest)"
  default: true

# ------------------------------------------------------------------------------
# Cache, Background Processing & Resilience
# ------------------------------------------------------------------------------
include_valkey:
  type: bool
  help: "Include Valkey in-memory store for session caching and hot-path state"
  default: true

include_distributed_worker:
  type: bool
  help: "Include SAQ async distributed background task worker & cron scheduler on Valkey"
  default: true

include_transactional_outbox:
  type: bool
  help: "Include Transactional Outbox pattern & Dead Letter Queue (DLQ) relay for guaranteed event delivery"
  default: true

include_idempotency_guard:
  type: bool
  help: "Include Valkey-backed Idempotency-Key validation middleware for transactional endpoints"
  default: true

include_rate_limiting:
  type: bool
  help: "Include dual-tier sliding-window rate limiting middleware (Traefik edge + Valkey atomic Lua)"
  default: true

# ------------------------------------------------------------------------------
# Observability, Edge Routing & UI
# ------------------------------------------------------------------------------
include_prometheus_metrics:
  type: bool
  help: "Expose /metrics endpoint for Prometheus scrapers & latency percentile tracking"
  default: true

include_sentry:
  type: bool
  help: "Enable Sentry centralized error tracking & APM instrumentation?"
  default: false

sentry_dsn:
  type: str
  help: "Sentry Project DSN (leave empty if configuring later):"
  default: ""
  when: "{{ include_sentry }}"

include_traefik:
  type: bool
  help: "Include Traefik v3 reverse proxy gateway for unified /api, /docs, and frontend routing"
  default: true

include_mailpit:
  type: bool
  help: "Include Mailpit mock SMTP server container for local development email inspection"
  default: true

include_frontend:
  type: bool
  help: "Include React + Vite + TypeScript frontend workspace with @hey-api auto-sync client"
  default: true

include_cloudflare_tunnel:
  type: bool
  help: "Include Cloudflare Zero Trust Tunnel container for secure public ingress"
  default: true

# ------------------------------------------------------------------------------
# Secrets & Credentials (Auto-Generated via Jinja on Copy)
# ------------------------------------------------------------------------------
secret_key:
  type: str
  help: "Application JWT signing secret key (64-hex char recommended)"
  default: "{% for _ in range(64) %}{{ '0123456789abcdef' | random }}{% endfor %}"

postgres_password:
  type: str
  help: "PostgreSQL superuser password (auto-generated alphanumeric)"
  default: "dev_{% for _ in range(20) %}{{ 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789' | random }}{% endfor %}"

first_superuser_email:
  type: str
  help: "Initial superuser email address"
  default: "admin@platform.internal"

first_superuser_password:
  type: str
  help: "Initial superuser login password (auto-generated)"
  default: "Admin!{% for _ in range(16) %}{{ 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789' | random }}{% endfor %}"

# ------------------------------------------------------------------------------
# Git Initialization & Automated Stack Bootstrap
# ------------------------------------------------------------------------------
init_git:
  type: bool
  help: "Initialize a fresh Git repository in the generated project directory?"
  default: true

auto_launch:
  type: bool
  help: "Automatically build, start container mesh, run migrations, seed superadmin, and sync SDK immediately after generation?"
  default: true

# ------------------------------------------------------------------------------
# Post-Generation Lifecycle Tasks
# ------------------------------------------------------------------------------
_tasks:
  - >-
    {% if init_git %}
    git init -b main && git add . && git commit -m "feat(init): scaffold {{ project_name }} from template" || true
    {% endif %}
  - >-
    {% if auto_launch %}
    make setup || true
    {% endif %}
